<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mixer">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Color Mixer</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000000; --muted:#8A8A8E; --sep:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12); --accent:#5856D6; --red:#FF3B30; --bar:rgba(249,249,249,.86);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --muted:#8E8E93; --sep:rgba(84,84,88,.6);
    --fill:rgba(118,118,128,.24); --accent:#7D7AFF; --red:#FF453A; --bar:rgba(22,22,24,.86);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --muted:#8E8E93; --sep:rgba(84,84,88,.6);
  --fill:rgba(118,118,128,.24); --accent:#7D7AFF; --red:#FF453A; --bar:rgba(22,22,24,.86);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  font-size:17px;line-height:1.3;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.screen{display:none}.screen.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.title{font-size:34px;font-weight:700;letter-spacing:.01em;margin:14px 4px 12px}
.section{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:26px 16px 7px}
.foot{font-size:13px;color:var(--muted);margin:7px 16px 0;line-height:1.35}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:60px;height:.5px;background:var(--sep)}
.cell.plain + .cell.plain::before{left:16px}

/* result */
.hero{border-radius:22px;aspect-ratio:1.15/1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;
  transition:background-color .4s ease;box-shadow:inset 0 -40px 60px rgba(0,0,0,.08);position:relative;overflow:hidden}
.hero .hex{font-size:40px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .rgb{font-size:15px;opacity:.75;font-variant-numeric:tabular-nums}
.hero .copy{position:absolute;top:14px;right:14px;border:0;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero.darktext{color:#000}.hero.lighttext{color:#fff}
.hero.lighttext .copy{background:rgba(0,0,0,.25);color:#fff}
.strip{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 4px 0}
.strip div{transition:flex-grow .3s}

.dot{width:32px;height:32px;border-radius:50%;flex:none;border:.5px solid rgba(0,0,0,.15);position:relative;overflow:hidden}
.dot input{position:absolute;inset:-10px;width:60px;height:60px;opacity:0}
.label{flex:1;min-width:0}
.label .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px}
.stepper button{width:40px;height:32px;border:0;background:none;font-size:20px;line-height:1}
.stepper button:active{opacity:.4}
.stepper span{min-width:22px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);padding:0 4px}
.del{width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:17px;font-weight:700;line-height:24px;padding:0;flex:none}
.del:disabled{opacity:.25}
.addrow{color:var(--accent);border:0;background:none;width:100%;text-align:left}
.addrow .plus{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}

/* controls */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;width:100%}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.toggle{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.toggle:checked{background:#34C759}
.toggle:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{color:var(--muted);font-variant-numeric:tabular-nums}
.chev{color:var(--muted);opacity:.6}

/* colors tab */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:18px 10px}
.sw{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;line-height:1.2;text-align:center;padding:0}
.sw i{width:56px;height:56px;border-radius:50%;border:.5px solid rgba(0,0,0,.15);transition:transform .15s}
.sw:active i{transform:scale(.88)}
.sw .badge{position:absolute}
.hexfield{flex:1;border:0;background:none;outline:none;font-variant-numeric:tabular-nums;text-transform:uppercase;min-width:0}
.btn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:15px}
.btn:disabled{opacity:.35}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);z-index:5}
.tabbar button{flex:0 1 180px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);padding:2px 0}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar svg{width:28px;height:28px}
.count{position:absolute;margin-left:22px;margin-top:-2px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.tabwrap{position:relative;display:flex;flex-direction:column;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:rgba(30,30,32,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:8px;pointer-events:none;transition:all .25s;z-index:6;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- MIX SCREEN -->
  <section class="screen active" id="mixScreen">
    <h1 class="title">Mix</h1>
    <div class="hero" id="hero">
      <button class="copy" id="copy">Copy</button>
      <div class="hex" id="hexOut">#000000</div>
      <div class="rgb" id="rgbOut">rgb(0, 0, 0)</div>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>

    <div class="section">Closest Deli marker</div>
    <div class="group"><div class="cell"><span class="dot" id="closeChip"></span><div class="label"><div class="t" id="closeName">—</div><div class="s" id="closeHex"></div></div></div></div>

    <div class="section" id="inMixHead">In the mix</div>
    <div class="group" id="rows"></div>
    <div class="foot" id="ratio"></div>

    <div class="section">Mixing</div>
    <div class="group">
      <div class="cell plain"><div class="seg" role="group" aria-label="Mixing style">
        <button id="mPaint" aria-pressed="true">Paint</button><button id="mLight" aria-pressed="false">Light</button></div></div>
      <div class="cell plain"><div class="label">Pastel</div><input type="checkbox" class="toggle" id="pastelOn" aria-label="Pastel"></div>
      <div class="cell plain" id="softRow" hidden><div class="label"><div style="display:flex;justify-content:space-between"><span>Softness</span><span class="val" id="softVal">50%</span></div>
        <input type="range" id="softness" min="10" max="90" value="50" aria-label="Softness"></div></div>
      <div class="cell plain" id="baseRow" hidden><span class="dot" id="baseChip" style="width:22px;height:22px"></span><div class="label s" style="font-size:15px;color:var(--muted)" id="baseText"></div></div>
    </div>
    <div class="foot" id="modenote"></div>
    <div class="section">Start over</div>
    <div class="group"><button class="cell plain addrow" id="clear" style="color:var(--red)">Clear mix</button></div>
  </section>

  <!-- COLORS SCREEN -->
  <section class="screen" id="colorsScreen">
    <h1 class="title">Colors</h1>
    <div class="seg" role="group" aria-label="Palette" id="paletteSeg">
      <button data-p="deli" aria-pressed="true">Deli Markers</button>
      <button data-p="pastel" aria-pressed="false">Pastel</button>
      <button data-p="bold" aria-pressed="false">Bold</button>
    </div>
    <div class="section" id="palHead">Deli acrylic markers</div>
    <div class="group"><div class="swatches" id="swatches"></div></div>
    <div class="foot" id="palFoot"></div>

    <div class="section">Custom color</div>
    <div class="group">
      <div class="cell"><span class="dot" id="customDot" style="background:#5856D6"><input type="color" id="customPick" value="#5856d6" aria-label="Pick a custom color"></span>
        <input class="hexfield" id="customHex" value="#5856D6" maxlength="7" spellcheck="false" aria-label="Hex code">
        <button class="btn" id="customAdd">Add</button></div>
    </div>
    <div class="foot">Tap the circle to pick any color, or type a hex code.</div>
  </section>
</div>

<nav class="tabbar" role="tablist">
  <button role="tab" aria-selected="true" data-tab="mixScreen">
    <span class="tabwrap"><svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 3.5c-.4 0-.8.2-1 .5C10.4 7.6 6.5 13 6.5 17a7.5 7.5 0 0 0 15 0c0-4-3.9-9.4-6.5-13-.2-.3-.6-.5-1-.5z"/></svg><span class="count" id="tabCount">2</span></span>Mix</button>
  <button role="tab" aria-selected="false" data-tab="colorsScreen">
    <svg viewBox="0 0 28 28" fill="currentColor"><circle cx="8" cy="8" r="4"/><circle cx="20" cy="8" r="4"/><circle cx="8" cy="20" r="4"/><circle cx="20" cy="20" r="4"/></svg>Colors</button>
</nav>
<div class="toast" id="toast"><i id="toastDot"></i><span id="toastText"></span></div>

<script>
const $=id=>document.getElementById(id);
const DELI=[
 ["White","#FFFFFF"],["Light Yellow","#FFF3A0"],["Yellow","#FFE11A"],["Orange Yellow","#FFB81C"],
 ["Sun Orange","#FF9A1F"],["Orange","#F26B21"],["Peach","#FFB59A"],["Red","#E3242B"],
 ["Rose","#E0457B"],["Pink","#F47FB0"],["Pearl Pink","#F6C6D2"],["Baby Pink","#FBD3DF"],
 ["Lavender","#C8B6E6"],["Violet","#8A5CC7"],["Purple","#6B2E91"],["Royal Blue","#1F4FB5"],
 ["Cyan Blue","#00A6D6"],["Sky Blue","#6EC6F0"],["Light Blue","#A9DCF5"],["Peacock Green","#00857A"],
 ["Bright Green","#3BB54A"],["Light Green","#9ED36A"],["Pastel Green","#BFE8C0"],["Pale Green","#D9F0C9"],
 ["Moss Green","#6B7D2A"],["Brown","#7A4A2A"],["Grey","#9A9A9A"],["Black","#1A1A1A"]
].map(([name,hex])=>({name,hex}));
const PALETTES={
  deli:{head:"Deli acrylic markers",foot:"Shades are close on-screen matches; real marker ink may look slightly different.",list:DELI},
  pastel:{head:"Pastel colors",foot:"Soft, light tones. Mixing these keeps results gentle.",list:[["Blush","#FFB3BA"],["Apricot","#FFDFBA"],["Butter","#FFFFBA"],["Mint","#BAFFC9"],["Baby Blue","#BAE1FF"],["Lilac","#D7BAFF"],["Candy","#FFC8E6"],["Seafoam","#C9F2EC"],["Oat","#E8D5C4"],["Sage","#D6E4B8"]].map(([name,hex])=>({name,hex}))},
  bold:{head:"Bold colors",foot:"Strong primaries and secondaries for classic mixing.",list:[["Red","#E53935"],["Yellow","#FDD835"],["Blue","#1E63D6"],["White","#FFFFFF"],["Black","#111111"],["Green","#43A047"],["Orange","#FB8C00"],["Purple","#8E24AA"],["Cyan","#00ACC1"],["Magenta","#EC407A"],["Brown","#795548"],["Grey","#9E9E9E"]].map(([name,hex])=>({name,hex}))}
};

// ---------- state (saved on this device) ----------
let state={mode:"paint",pastel:false,softness:50,palette:"deli",
  colors:[{hex:"#FFE11A",parts:1,name:"Deli Yellow"},{hex:"#1F4FB5",parts:1,name:"Deli Royal Blue"}]};
try{const s=JSON.parse(localStorage.getItem("mixer-state")||"null");if(s&&Array.isArray(s.colors))state=Object.assign(state,s);}catch(e){}
const save=()=>{try{localStorage.setItem("mixer-state",JSON.stringify(state));}catch(e){}};

// ---------- color math ----------
function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgbToHex(r,g,b){return"#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("").toUpperCase();}
const validHex=h=>/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h.trim());
function rgb2ryb(r,g,b){const w=Math.min(r,g,b);r-=w;g-=w;b-=w;const mg=Math.max(r,g,b);let y=Math.min(r,g);r-=y;g-=y;
  if(b&&g){b/=2;g/=2;}y+=g;b+=g;const my=Math.max(r,y,b);if(my){const n=mg/my;r*=n;y*=n;b*=n;}return[r+w,y+w,b+w];}
function ryb2rgb(r,y,b){const w=Math.min(r,y,b);r-=w;y-=w;b-=w;const my=Math.max(r,y,b);let g=Math.min(y,b);y-=g;b-=g;
  if(b&&g){b*=2;g*=2;}r+=y;g+=y;const mg=Math.max(r,g,b);if(mg){const n=my/mg;r*=n;g*=n;b*=n;}return[r+w,g+w,b+w];}
const toLin=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);};
const toSrgb=c=>255*(c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055);
function mix(){
  const cs=state.colors;if(!cs.length)return[255,255,255];
  const total=cs.reduce((s,c)=>s+c.parts,0)||1;let acc=[0,0,0];
  for(const c of cs){const rgb=hexToRgb(c.hex),w=c.parts/total;const v=state.mode==="paint"?rgb2ryb(...rgb):rgb.map(toLin);acc=acc.map((a,i)=>a+v[i]*w);}
  return(state.mode==="paint"?ryb2rgb(...acc):acc.map(toSrgb)).map(v=>Math.max(0,Math.min(255,v)));
}
function closestDeli(rgb){let best=null,bd=Infinity;for(const d of DELI){const[r,g,b]=hexToRgb(d.hex),rm=(r+rgb[0])/2;
  const dist=(2+rm/256)*(r-rgb[0])**2+4*(g-rgb[1])**2+(2+(255-rm)/256)*(b-rgb[2])**2;if(dist<bd){bd=dist;best=d;}}return best;}
const lum=([r,g,b])=>(0.299*r+0.587*g+0.114*b)/255;
const nameFor=hex=>{for(const p of Object.values(PALETTES)){const m=p.list.find(d=>d.hex===hex);if(m)return(p===PALETTES.deli?"Deli ":"")+m.name;}return"";};

// ---------- mix screen ----------
function renderRows(){
  const rows=$("rows");rows.innerHTML="";
  state.colors.forEach((c,i)=>{
    const row=document.createElement("div");row.className="cell";
    row.innerHTML=`<span class="dot" style="background:${c.hex}"><input type="color" value="${c.hex.toLowerCase()}" aria-label="Change color ${i+1}"></span>
      <div class="label"><div class="t">${c.name||"Custom"}</div><div class="s">${c.hex}</div></div>
      <div class="stepper"><button data-d="-1" aria-label="Fewer parts">−</button><span>${c.parts}</span><button data-d="1" aria-label="More parts">+</button></div>
      <button class="del" aria-label="Remove ${c.name||c.hex}" ${state.colors.length<=1?"disabled":""}>−</button>`;
    row.querySelector("input").addEventListener("input",e=>{c.hex=e.target.value.toUpperCase();c.name=nameFor(c.hex);
      row.querySelector(".dot").style.background=c.hex;row.querySelector(".t").textContent=c.name||"Custom";row.querySelector(".s").textContent=c.hex;update();});
    row.querySelectorAll(".stepper button").forEach(b=>b.addEventListener("click",()=>{c.parts=Math.max(1,Math.min(99,c.parts+ +b.dataset.d));row.querySelector(".stepper span").textContent=c.parts;update();}));
    row.querySelector(".del").addEventListener("click",()=>{state.colors.splice(i,1);renderRows();update();});
    rows.appendChild(row);
  });
  const add=document.createElement("button");add.className="cell addrow";
  add.innerHTML=`<span class="plus">+</span><span>Add Color</span>`;add.addEventListener("click",()=>showTab("colorsScreen"));
  rows.appendChild(add);
  $("inMixHead").textContent=`In the mix · ${state.colors.length}`;
  $("tabCount").textContent=state.colors.length;
}

function update(){
  const base=mix();let rgb=base;
  if(state.pastel){const t=state.softness/100,avg=(base[0]+base[1]+base[2])/3;rgb=base.map(v=>{const d=v+(avg-v)*t*.25;return d+(255-d)*t;});}
  rgb=rgb.map(Math.round);const hex=rgbToHex(...rgb);
  const hero=$("hero");hero.style.backgroundColor=hex;
  hero.classList.toggle("darktext",lum(rgb)>.6);hero.classList.toggle("lighttext",lum(rgb)<=.6);
  $("hexOut").textContent=hex;$("rgbOut").textContent=`rgb(${rgb.join(", ")})`;
  const near=closestDeli(rgb);$("closeChip").style.background=near.hex;
  $("closeName").textContent=near.name+(near.hex===hex?" — exact match":"");$("closeHex").textContent=near.hex;
  $("baseChip").style.background=rgbToHex(...base);$("baseText").textContent="Before pastel: "+rgbToHex(...base);
  const total=state.colors.reduce((s,c)=>s+c.parts,0);
  $("strip").innerHTML=state.colors.map(c=>`<div style="background:${c.hex};flex-grow:${c.parts}"></div>`).join("");
  $("ratio").textContent=state.colors.length?`Ratio ${state.colors.map(c=>c.parts).join(" : ")} (${total} parts)`:"";
  document.querySelector('meta[name="theme-color"]');
  save();
}
function syncControls(){
  $("mPaint").setAttribute("aria-pressed",state.mode==="paint");$("mLight").setAttribute("aria-pressed",state.mode==="light");
  $("modenote").textContent=state.mode==="paint"?"Paint mixes like real pigment: yellow + blue = green.":"Light blends like screens and light beams.";
  $("pastelOn").checked=state.pastel;$("softRow").hidden=!state.pastel;$("baseRow").hidden=!state.pastel;
  $("softness").value=state.softness;$("softVal").textContent=state.softness+"%";
}
$("mPaint").onclick=()=>{state.mode="paint";syncControls();update();};
$("mLight").onclick=()=>{state.mode="light";syncControls();update();};
$("pastelOn").onchange=e=>{state.pastel=e.target.checked;syncControls();update();};
$("softness").oninput=e=>{state.softness=+e.target.value;$("softVal").textContent=state.softness+"%";update();};
$("clear").onclick=()=>{state.colors=[];renderRows();update();showTab("colorsScreen");};
$("copy").onclick=async()=>{const t=$("hexOut").textContent;try{await navigator.clipboard.writeText(t);$("copy").textContent="Copied";}catch(e){$("copy").textContent=t;}setTimeout(()=>$("copy").textContent="Copy",1300);};

// ---------- colors screen ----------
function addColor(hex,name){state.colors.push({hex,parts:1,name});renderRows();update();toast(hex,`Added ${name||hex}`);if(navigator.vibrate)navigator.vibrate(10);}
function renderPalette(){
  const p=PALETTES[state.palette];$("palHead").textContent=p.head;$("palFoot").textContent=p.foot;
  document.querySelectorAll("#paletteSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===state.palette));
  const g=$("swatches");g.innerHTML="";
  p.list.forEach(d=>{const b=document.createElement("button");b.className="sw";b.innerHTML=`<i style="background:${d.hex}"></i><span>${d.name}</span>`;
    b.setAttribute("aria-label","Add "+d.name);b.onclick=()=>addColor(d.hex,(state.palette==="deli"?"Deli ":"")+d.name);g.appendChild(b);});
}
document.querySelectorAll("#paletteSeg button").forEach(b=>b.onclick=()=>{state.palette=b.dataset.p;renderPalette();save();});
$("customPick").oninput=e=>{const h=e.target.value.toUpperCase();$("customHex").value=h;$("customDot").style.background=h;$("customAdd").disabled=false;};
$("customHex").oninput=e=>{let v=e.target.value.trim();const ok=validHex(v);$("customAdd").disabled=!ok;
  if(ok){if(v[0]!=="#")v="#"+v;const h=rgbToHex(...hexToRgb(v));$("customDot").style.background=h;$("customPick").value=h.toLowerCase();}};
$("customAdd").onclick=()=>{let v=$("customHex").value.trim();if(!validHex(v))return;if(v[0]!=="#")v="#"+v;const h=rgbToHex(...hexToRgb(v));addColor(h,nameFor(h));};

// ---------- tabs, toast, icon ----------
function showTab(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===id));window.scrollTo(0,0);}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
let tt;function toast(hex,text){$("toastDot").style.background=hex;$("toastText").textContent=text;$("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("show"),1300);}

syncControls();renderRows();renderPalette();update();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
